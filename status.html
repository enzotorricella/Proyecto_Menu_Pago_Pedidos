<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estado del pedido - Pedido Burger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ font-family:Arial,Helvetica,sans-serif; padding:18px; background:#fff8f0; }
    .board{ display:flex; gap:18px; align-items:flex-start; }
    .column{ background:#fff; border-radius:8px; padding:12px; width:45%; min-height:280px; border:1px solid #eee; }
    .card{ padding:10px; border-radius:6px; margin-bottom:8px; box-shadow:0 6px 12px rgba(0,0,0,0.04); }
    .muted{ color:#666; font-size:.9rem; }
  </style>
</head>
<body>
  <h3>Seguimiento del pedido</h3>
  <p class="muted">Ingresá tu nombre para filtrar. Se actualiza en tiempo real.</p>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <input id="filter-name" class="form-control" type="text" placeholder="Tu nombre (ej: Juan)" style="max-width:320px">
    <button id="btn-refresh" class="btn btn-outline-secondary">Refrescar</button>
  </div>

  <div class="board">
    <div class="column" id="col-processing">
      <h5>En Proceso</h5>
      <div id="list-processing"></div>
    </div>
    <div class="column" id="col-ready">
      <h5>Para Retirar</h5>
      <div id="list-ready"></div>
    </div>
  </div>

  <script>
    (function(){
      const filterInput = document.getElementById('filter-name');
      const listProcessing = document.getElementById('list-processing');
      const listReady = document.getElementById('list-ready');
      const btnRefresh = document.getElementById('btn-refresh');
      const chan = ('BroadcastChannel' in window) ? new BroadcastChannel('orders') : null;
      let orders = [];

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
      }

      function render(){
        const name = (filterInput.value||'').trim().toLowerCase();
        listProcessing.innerHTML = ''; listReady.innerHTML = '';
        orders.filter(o => o.status === 'En Proceso').filter(o=> !name || o.customerName.toLowerCase().includes(name)).forEach(o=>{
          const div = document.createElement('div'); div.className='card';
          div.innerHTML = `<strong>${escapeHtml(o.customerName)}</strong><div class="muted">${escapeHtml(o.type||'')} · ${(o.items || []).map(i=>escapeHtml(i.title)+' ×'+escapeHtml(i.qty)).join(', ')}</div>`;
          listProcessing.appendChild(div);
        });
        orders.filter(o => o.status === 'Para Retirar').filter(o=> !name || o.customerName.toLowerCase().includes(name)).forEach(o=>{
          const div = document.createElement('div'); div.className='card';
          div.innerHTML = `<strong>${escapeHtml(o.customerName)}</strong><div class="muted">${escapeHtml(o.type||'')} · ${(o.items || []).map(i=>escapeHtml(i.title)+' ×'+escapeHtml(i.qty)).join(', ')}</div>`;
          listReady.appendChild(div);
        });
      }

      function requestAll(){
        if(!chan) return;
        chan.postMessage({ action:'request_all' });
      }

      if(chan){
        chan.onmessage = (ev)=>{
          const data = ev.data || {};
          if(data.action === 'all' && Array.isArray(data.orders)){ orders = data.orders; render(); }
          else if(data.action === 'add' && data.order){ orders.push(data.order); render(); }
          else if(data.action === 'update' && data.order){
            const idx = orders.findIndex(o=>o.id===data.order.id);
            if(idx>=0) orders[idx]=data.order; else orders.push(data.order);
            render();
          } else if(data.action === 'delete' && data.id){ orders = orders.filter(o=>o.id!==data.id); render(); }
          else if(data.action === 'clear'){ orders = []; render(); }
        };
      } else {
        window.addEventListener('message', (ev)=>{ const d=ev.data||{}; if(d.action==='all'&&Array.isArray(d.orders)){ orders=d.orders; render(); } }, false);
        try{ const w = window.open('Comanda.html','comanda_window'); w.postMessage({ type:'request_all' }, '*'); }catch(e){}
      }

      filterInput.addEventListener('input', render);
      btnRefresh.addEventListener('click', requestAll);

      requestAll();
      window.status_page = { render, requestAll };
    })();
  </script>
</body>
</html>
